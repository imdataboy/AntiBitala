sources:
  # -------------------------
  # National base sources
  # -------------------------

  - source_key: geofabrik_morocco_osm
    source_name: Geofabrik Morocco OpenStreetMap Extract
    source_type: open_geographic_data
    country: Morocco
    region: null
    city: null
    sector: general
    coverage_scope: national
    reliability_level: medium
    access_method: downloadable_file
    base_url: https://download.geofabrik.de/africa/morocco.html
    enabled: true
    update_frequency: quarterly
    notes: National OSM extract. Useful for businesses, offices, factories, shops, coordinates, and addresses. Coverage varies by city.

  - source_key: industrial_estate_morocco
    source_name: Industrial Estate Morocco
    source_type: official_industrial_zone_platform
    country: Morocco
    region: null
    city: null
    sector: industry
    coverage_scope: national_industrial
    reliability_level: high
    access_method: web_adapter
    base_url: https://industrial-estate.gov.ma/
    enabled: true
    update_frequency: quarterly
    notes: National platform for industrial zones and industrial land in Morocco.

  - source_key: amdie_economic_zones
    source_name: AMDIE Economic Activity Zones
    source_type: official_investment_source
    country: Morocco
    region: null
    city: null
    sector: investment
    coverage_scope: national
    reliability_level: high
    access_method: web_adapter
    base_url: https://amdie.gov.ma/
    enabled: true
    update_frequency: quarterly
    notes: National investment and economic zone information.

  - source_key: ompic_rcc
    source_name: OMPIC RCC / DirectInfo
    source_type: official_legal_registry
    country: Morocco
    region: null
    city: null
    sector: legal_registry
    coverage_scope: national
    reliability_level: very_high
    access_method: manual_or_web_adapter
    base_url: https://www.ompic.ma/
    enabled: true
    update_frequency: quarterly
    notes: Legal verification source. Use carefully depending on available public access.

  - source_key: wikidata_morocco_companies
    source_name: Wikidata Morocco Companies
    source_type: open_knowledge_graph
    country: Morocco
    region: null
    city: null
    sector: general
    coverage_scope: national_notable_companies
    reliability_level: medium_high
    access_method: sparql_api
    base_url: https://query.wikidata.org/
    enabled: true
    update_frequency: quarterly
    notes: Useful for large and notable companies. Not complete for SMEs.

  # -------------------------
