    coverage_scope: multi_city
    reliability_level: high
    access_method: web_adapter
    base_url: https://www.technopark.ma/
    enabled: true
    update_frequency: quarterly
    notes: Important source for startups, software, IT, digital, AI, and innovation companies across several Moroccan cities.

