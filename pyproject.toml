[project]
name = "antibitala"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.4.1",
    "duckdb>=1.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "requests>=2.34.2",
    "sqlite-utils>=3.39",
    "streamlit>=1.58.0",
    "tqdm>=4.68.3",
    "trafilatura>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[project.scripts]
antibitala = "antibitala.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
